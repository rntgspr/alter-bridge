# Builds the Claude plugin zip with go/release.sh when a v* tag is pushed,
# publishes it as a GitHub Release asset, and points the alter-bridge entry of
# .claude-plugin/marketplace.json on the default branch at that asset.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Test
        working-directory: go
        run: |
          go test ./...
          ./launcher_test.sh
          ./archive-source_test.sh

      - name: Build
        run: go/release.sh "$TAG"

      - name: Publish release
        run: gh release create "$TAG" "dist/alter-bridge-$TAG.zip" --title "$TAG" --generate-notes

      - name: Point marketplace at the release zip
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/alter-bridge-$TAG.zip"
          sha="$(sha256sum "dist/alter-bridge-$TAG.zip" | cut -d' ' -f1)"

          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" FETCH_HEAD
          go/archive-source.sh "$url" "$sha"

          if git diff --quiet; then
            echo "marketplace.json already points at $url"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): point marketplace at $TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
